name: Update profile

on:
  schedule:
    - cron: "17 20 * * *"      # 每天 04:17（北京时间）自动重画一次数据
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.toml
      - stats.json
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet -r requirements.txt

      - name: Fetch GitHub stats
        run: python scripts/stats.py            # 抓不到就用旧的 stats.json，不会让流水线挂掉

      - name: Fetch today's weather
        run: python scripts/weather.py          # 同上：抓不到就沿用上一次的天气

      - name: Draw the pictures
        run: python scripts/gen.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update profile pictures"
          echo "--- worktree ---"
          git status --short
          git pull --rebase --autostash origin main
          git push origin HEAD:main
